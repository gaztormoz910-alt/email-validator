[pytest]
# Собираем тесты ТОЛЬКО из tests/.
#
# Историческая причина: в корне лежали отладочные скрипты test_*.py, которые
# ходили в сеть прямо на импорте, а test_direct.py содержал null-байты и вешал
# сборку pytest. Сами скрипты убраны (остались в истории git), но настройка
# сохраняется намеренно: audit/ — это одноразовые прогоны аудита, а не тесты,
# и подхватывать их автоматически не нужно.
testpaths = tests
norecursedirs = audit .git __pycache__ data assets tor_bin .unlazy
