[pytest]
# Собираем тесты ТОЛЬКО из tests/. В корне лежат отладочные скрипты
# (test_aol.py, test_direct.py, test_yahoo.py и др.): они не тесты, ходят в сеть
# при импорте, а test_direct.py содержит null-байты и вешает сборку pytest.
testpaths = tests
norecursedirs = audit .git __pycache__ data assets
