[pytest]
# Собираем тесты ТОЛЬКО из tests/.
#
# Историческая причина: в корне лежали отладочные скрипты test_*.py, которые
# ходили в сеть прямо на импорте, а test_direct.py содержал null-байты и вешал
# сборку pytest. Сами скрипты убраны (остались в истории git), но настройка
# сохраняется намеренно: audit/ — это одноразовые прогоны аудита, а не тесты,
# и подхватывать их автоматически не нужно.
testpaths = tests
norecursedirs = audit .git __pycache__ data assets tor_bin .unlazy

# Медленные тесты отделены от быстрых.
#
# Полный набор идёт около шести минут, и почти всё это время занимают
# проверки на масштаб: чтение базы на десять миллионов строк, потолок
# памяти, скорость поиска. Они нужны — но не на каждый чих. Быстрый круг:
#     python -m pytest -m "not slow"
markers =
    slow: тяжёлые проверки масштаба, памяти и скорости (минуты, гигабайты)

# Предел времени на ОДИН тест.
#
# Зависший тест раньше вешал весь прогон навсегда: без предела его нельзя
# отличить от долгого. Пять минут — с запасом над самым тяжёлым из нынешних.
# Требует pytest-timeout (см. requirements-dev.txt); без него pytest просто
# предупредит о незнакомой настройке и пойдёт дальше.
timeout = 300
