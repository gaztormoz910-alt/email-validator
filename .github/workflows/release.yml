name: build-installer

# ТРИ ОС, ТРИ РАННЕРА. PyInstaller не умеет кросс-сборку: под каждую систему
# собирает она сама. Поэтому здесь три независимые работы, а четвёртая
# складывает их результаты в один релиз.

on:
  push:
    tags: ['v*']
  # Кнопка "Run workflow": собрать и проверить, ничего не публикуя.
  workflow_dispatch:

permissions:
  # Нужно, чтобы создать релиз и залить в него файлы.
  contents: write

jobs:

  # ======================================================================
  # WINDOWS — установщик .exe
  # ======================================================================
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          # PyInstaller пинуется в requirements.txt — там же, где его
          # видит tools/check_deps.py. Второе место для того же числа
          # означало бы, что CI однажды соберёт не той версией.
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Сверить иконку с мастером
        # СВЕРЯЕМ, а не пересобираем: PNG->ICO не воспроизводится побайтово
        # между машинами (замерено на релизе 1.0.0 — один байт контейнера при
        # НУЛЕВОМ отличии пикселей), и sha256 иконки падал бы у пользователя.
        #
        # Причина провала дублируется в АННОТАЦИЮ. Лог сборки у публичного
        # репозитория всё равно требует входа, а аннотация читается без него —
        # без этого разбирать падение можно было бы только угадыванием, чем я
        # и занимался на прогоне 1.1.0.
        shell: bash
        run: |
          set +e
          OUT=$(python tools/check_icon.py 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Иконка::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Собрать .exe
        run: python -m PyInstaller --noconfirm --clean --log-level WARN MailFact.spec

      - name: Проверить зависимости внутри сборки
        run: python tools/check_deps.py --dist dist/MailFact

      - name: Настоящий прогон внутри собранной программы
        shell: pwsh
        run: |
          # Запуск окна не доказывает почти ничего: словари имён, модель
          # spaCy, корпус wordsegment и запись sqlite подключаются позже.
          $p = Start-Process -FilePath "dist\MailFact\MailFact.exe" `
               -ArgumentList "--selftest","selftest.log" -PassThru -Wait
          if (Test-Path "selftest.log") { Get-Content "selftest.log" }
          if ($p.ExitCode -ne 0) { throw "selftest вернул $($p.ExitCode)" }

      - name: Проверить диалог выбора файла
        shell: pwsh
        run: |
          # САМ диалог не проверяло ничто: selftest подменяет его результат,
          # а проверка окна только смотрит на заголовок. Владелец нажал
          # кнопку в собранной программе и получил «choose: 500» — и это
          # дошло до него только потому, что здесь ничего не стояло.
          $p = Start-Process -FilePath "dist\MailFact\MailFact.exe" `
               -ArgumentList "--selftest-dialog","dialog.log" -PassThru -Wait
          if (Test-Path "dialog.log") { Get-Content "dialog.log" }
          if ($p.ExitCode -ne 0) {
            $tail = if (Test-Path "dialog.log") { (Get-Content "dialog.log" -Tail 10) -join '~' } else { 'журнала нет' }
            Write-Host "::error title=Диалог выбора файла::$tail"
            throw "проба диалога вернула $($p.ExitCode)"
          }
          # Кода возврата мало. Проба обязана подтвердить, что условие, из-за
          # которого диалог ломался, в ней ДЕЙСТВИТЕЛЬНО БЫЛО: у процесса нет
          # своих потоков вывода. Запущенная с трубами, она бы их унаследовала
          # и удостоверяла бы то, чего сама не создала.
          #
          # Имена переменных латиницей: кириллица в именах уже дважды делала
          # шаг сборки пустышкой (в bash это вообще не присваивание).
          $text = if (Test-Path "dialog.log") { Get-Content "dialog.log" -Raw -Encoding utf8 } else { "" }
          foreach ($need in @('DIALOG_OK', 'исходные: __stdout__=True __stderr__=True', 'собран: True')) {
            if (-not $text.Contains($need)) {
              Write-Host "::error title=Диалог выбора файла::в журнале нет строки «$need»"
              throw "проба проверила не то: в журнале нет «$need»"
            }
          }

      - name: Запустить окно
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MailFact\MailFact.exe" -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          if ($p.HasExited) { throw "программа завершилась сама, код $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Stop-Process -Id $p.Id -Force
          Write-Host "заголовок окна: '$title'"
          if ($title -notlike 'MailFact*') { throw "неожиданный заголовок окна: '$title'" }

      - name: Собрать установщик
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" MailFact.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Проверить, что в сборке нет следов машины сборки
        # Путь проекта, имя компьютера, данные git — ни в одном файле сборки,
        # ни в распакованном байткоде, ни в сжатом потоке установщика; время
        # файлов внутри установщика — в UTC. Свои маркеры (фамилию, домашний
        # IP) владелец кладёт в секрет репозитория MAILFACT_PRIVATE_MARKERS
        # через «;»: в открытый файл их писать нельзя, а секрет не виден никому,
        # и проверка его значений не печатает. Нет секрета — проверяются только
        # данные машины сборки.
        shell: bash
        env:
          MAILFACT_PRIVATE_MARKERS: ${{ secrets.MAILFACT_PRIVATE_MARKERS }}
        run: |
          set +e
          OUT=$(python tools/check_privacy.py --dist dist/MailFact --installer installer/MailFact-setup.exe 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Следы машины сборки::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Проверить установщик
        shell: pwsh
        run: |
          $f = "installer\MailFact-setup.exe"
          if (-not (Test-Path $f)) { throw "нет файла $f" }
          $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
          Write-Host "установщик: $mb MB"
          if ($mb -lt 60) { throw "установщик подозрительно мал: $mb MB" }

      - name: Проверить, что установщик умеет доставлять WebView2
        shell: pwsh
        run: |
          # Раннер — Windows Server, рантайм там обычно уже стоит, и обычная
          # установка ветку доставки не прошла бы вовсе. Ключ /FORCEWEBVIEW2
          # заставляет её пройти, и в журнале установки видно, скачался ли
          # загрузчик и с каким кодом он завершился. Без этого шага ветка,
          # ради которой всё и делалось, не проверялась бы никогда.
          $log = "$env:TEMP\wv2.log"
          $p = Start-Process -FilePath "installer\MailFact-setup.exe" `
               -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",
                             "/FORCEWEBVIEW2=1","/LOG=$log",
                             "/DIR=$env:TEMP\wv2check" -PassThru -Wait
          if (-not (Test-Path $log)) { throw "установщик не оставил журнала" }
          $text = Get-Content $log -Raw
          if ($text -notmatch 'Качаю загрузчик WebView2') { throw "ветка доставки WebView2 не выполнялась" }
          if ($text -notmatch 'Загрузчик WebView2 вернул код') { throw "загрузчик WebView2 не запускался" }
          Select-String -Path $log -Pattern 'WebView2' | ForEach-Object { $_.Line }
          if ($p.ExitCode -ne 0) { throw "установка вернула $($p.ExitCode)" }

      - name: Проверить установленную копию
        run: python tools/check_installed.py --setup "installer\MailFact-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/MailFact-setup.exe

  # ======================================================================
  # macOS — .app внутри .dmg
  # ======================================================================
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Определить версию
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Сверить иконку с мастером
        # СВЕРЯЕМ, а не пересобираем: PNG->ICO не воспроизводится побайтово
        # между машинами (замерено на релизе 1.0.0 — один байт контейнера при
        # НУЛЕВОМ отличии пикселей), и sha256 иконки падал бы у пользователя.
        #
        # Причина провала дублируется в АННОТАЦИЮ. Лог сборки у публичного
        # репозитория всё равно требует входа, а аннотация читается без него —
        # без этого разбирать падение можно было бы только угадыванием, чем я
        # и занимался на прогоне 1.1.0.
        shell: bash
        run: |
          set +e
          OUT=$(python tools/check_icon.py 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Иконка::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Собрать .app
        run: python -m PyInstaller --noconfirm --clean --log-level WARN MailFact.spec

      - name: Проверить, что в сборке нет следов машины сборки
        # То же, что на Windows, только установщика здесь нет: .dmg собирается
        # из этой самой папки .app без добавлений.
        env:
          MAILFACT_PRIVATE_MARKERS: ${{ secrets.MAILFACT_PRIVATE_MARKERS }}
        run: |
          set +e
          OUT=$(python tools/check_privacy.py --dist dist/MailFact.app 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Следы машины сборки macOS::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Настоящий прогон внутри собранной программы
        run: |
          # Тот же путь основного сценария, что на Windows. Дисплея не
          # требует: окно здесь не открывается вовсе.
          #
          # set +e обязателен. Оболочка шагов GitHub запускается с -e, и без
          # него падение программы обрывало бы шаг ДО вывода журнала: причину
          # провала было бы не увидеть вообще. Ровно это и случилось на
          # прогоне 1.1.1, где macOS упал молча.
          set +e
          ./dist/MailFact.app/Contents/MacOS/MailFact --selftest selftest.log
          RC=$?
          echo "--- журнал прогона ---"
          cat selftest.log 2>/dev/null || echo "журнал не создан"
          if [ $RC -ne 0 ]; then
            # Лог сборки требует входа, аннотация — нет.
            echo "::error title=Прогон macOS::$(tail -12 selftest.log 2>/dev/null | paste -sd '~' - || echo 'журнала нет')"
          fi
          exit $RC

      - name: Поднять окно
        run: |
          # Слабее, чем на Windows и Linux, и это named honestly: заголовок
          # окна на macOS читается только через AppleScript с разрешением на
          # управление компьютером, которого у раннера нет. Поэтому здесь
          # доказывается ровно одно — программа поднимает графический стек и
          # НЕ падает: при отсутствующей библиотеке или сломанном .app она
          # умерла бы за первые секунды.
          ./dist/MailFact.app/Contents/MacOS/MailFact &
          APPPID=$!
          sleep 40
          if ! kill -0 $APPPID 2>/dev/null; then
            wait $APPPID; echo "программа завершилась сама, код $?"; exit 1
          fi
          kill $APPPID 2>/dev/null || true
          echo "программа прожила 40 секунд с поднятым интерфейсом"

      - name: Собрать .dmg
        run: |
          hdiutil create -volname "MailFact" -srcfolder "dist/MailFact.app" \
            -ov -format UDZO "MailFact-macos.dmg"
          SIZE_MB=$(du -m MailFact-macos.dmg | cut -f1)
          echo "dmg: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 60 ]; then echo "dmg подозрительно мал"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: MailFact-macos.dmg

  # ======================================================================
  # LINUX — архив с программой и ярлыком
  # ======================================================================
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Системные библиотеки для движка окна
        # Qt WebEngine приезжает внутри сборки, но опирается на несколько
        # системных библиотек уровня ОС. Ставим их на раннере, чтобы проверка
        # окна была настоящей, а не пропущенной.
        run: |
          # libegl1 и libgl1 добавлены по ЗАМЕРУ, а не на всякий случай: на
          # прогоне 1.1.6 импорт QtWebEngineWidgets падал с
          # «ImportError: libEGL.so.1: cannot open shared object file».
          # Это СИСТЕМНАЯ графическая библиотека, а не Qt-шная: положить её
          # внутрь сборки нельзя, она обязана соответствовать драйверу
          # видео на конкретной машине. На Linux с рабочим столом она есть.
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool
          sudo apt-get install -y -qq libegl1 libgl1 libopengl0
          sudo apt-get install -y -qq libxkbcommon-x11-0 libnss3 libdbus-1-3
          sudo apt-get install -y -qq libxcb-cursor0 libxcb-icccm4 libxcb-image0
          sudo apt-get install -y -qq libxcb-keysyms1 libxcb-randr0 libxcb-shape0
          sudo apt-get install -y -qq libxcb-render-util0 libxcb-xinerama0
          sudo apt-get install -y -qq libxcomposite1 libxdamage1 libxrandr2
          sudo apt-get install -y -qq libxtst6 libxi6 libfontconfig1 libgbm1
          # Имя пакета звука разное в разных выпусках — пробуем оба.
          sudo apt-get install -y -qq libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Проверить, что движок окна вообще встал
        run: |
          # Ставится он по маркеру `sys_platform == "linux"` из requirements.
          # Если маркер не сработал или колёс под этот Python нет, PyQt6 не
          # встанет, и узнать об этом на шаге сборки было бы поздно: она
          # молча собрала бы программу без окна. Замерено на прогоне 1.1.5.
          set +e
          OUT=$(python -c "import PyQt6, qtpy; from PyQt6 import QtWebEngineWidgets as W; print('Qt есть:', PyQt6.__file__); print('WebEngine есть:', W.__name__)" 2>&1); RC=$?
          echo "$OUT"
          pip list 2>/dev/null | grep -i -E "pyqt|qtpy" || echo "в списке пакетов Qt не видно"
          if [ $RC -ne 0 ]; then
            echo "::error title=Движок окна Linux::$(echo "$OUT" | tail -8 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Определить версию
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${{ github.ref_name }}"; V="${V#v}"
          else
            V="0.0.0"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Сверить иконку с мастером
        # СВЕРЯЕМ, а не пересобираем: PNG->ICO не воспроизводится побайтово
        # между машинами (замерено на релизе 1.0.0 — один байт контейнера при
        # НУЛЕВОМ отличии пикселей), и sha256 иконки падал бы у пользователя.
        #
        # Причина провала дублируется в АННОТАЦИЮ. Лог сборки у публичного
        # репозитория всё равно требует входа, а аннотация читается без него —
        # без этого разбирать падение можно было бы только угадыванием, чем я
        # и занимался на прогоне 1.1.0.
        shell: bash
        run: |
          set +e
          OUT=$(python tools/check_icon.py 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Иконка::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Собрать программу
        run: |
          set +e
          OUT=$(python -m PyInstaller --noconfirm --clean --log-level WARN MailFact.spec 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Сборка Linux::$(echo "$OUT" | tail -15 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Проверить зависимости внутри сборки
        run: |
          set +e
          OUT=$(python tools/check_deps.py --dist dist/MailFact 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Зависимости Linux::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Проверить, что в сборке нет следов машины сборки
        # То же, что на Windows. Ярлык и УСТАНОВКА.txt, которые добавятся в
        # архив дальше, пишутся из этого же файла и личного не содержат.
        env:
          MAILFACT_PRIVATE_MARKERS: ${{ secrets.MAILFACT_PRIVATE_MARKERS }}
        run: |
          set +e
          OUT=$(python tools/check_privacy.py --dist dist/MailFact 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=Следы машины сборки Linux::$(echo "$OUT" | tail -12 | paste -sd '~' -)"
            exit $RC
          fi

      - name: Настоящий прогон внутри собранной программы
        run: |
          # Тот же путь основного сценария, что на Windows. Дисплея не
          # требует: окно здесь не открывается вовсе.
          #
          # set +e обязателен. Оболочка шагов GitHub запускается с -e, и без
          # него падение программы обрывало бы шаг ДО вывода журнала: причину
          # провала было бы не увидеть вообще. Ровно это и случилось на
          # прогоне 1.1.1, где macOS упал молча.
          set +e
          ./dist/MailFact/MailFact --selftest selftest.log
          RC=$?
          echo "--- журнал прогона ---"
          cat selftest.log 2>/dev/null || echo "журнал не создан"
          if [ $RC -ne 0 ]; then
            # Лог сборки требует входа, аннотация — нет.
            echo "::error title=Прогон Linux::$(tail -12 selftest.log 2>/dev/null | paste -sd '~' - || echo 'журнала нет')"
          fi
          exit $RC

      - name: Открыть окно под виртуальным экраном
        env:
          # Qt WebEngine — это Chromium. В контейнере раннера его песочница
          # не поднимается, и без этих флагов он молча не стартует. В
          # ПОСТАВЛЯЕМОЙ программе их нет: отключать песочницу у человека
          # ради удобства проверки нельзя, это его безопасность.
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu --disable-dev-shm-usage"
          QT_QPA_PLATFORM: xcb
        run: |
          # Selftest доказывает, что собрался ДВИЖОК. Окно он не открывает
          # вовсе, поэтому про сам интерфейс не говорит ничего. Здесь
          # программа поднимается по-настоящему на виртуальном экране, и
          # заголовок читается у окна, найденного ПО PID — искать по
          # ожидаемому тексту значило бы заранее исключить случай, когда
          # вместо окна вылезла ошибка.
          #
          # Причина провала уходит в аннотацию: «exit code 1» одинаков и
          # когда программа умерла, и когда окна просто не нашлось, а лог
          # сборки у публичного репозитория требует входа.
          xvfb-run -a --server-args="-screen 0 1440x900x24" bash -c '
            # Вывод программы уводим в файл: у сборки без консоли он
            # иначе теряется целиком, и причину смерти не увидеть.
            ./dist/MailFact/MailFact > app.log 2>&1 &
            APPPID=$!
            sleep 50
            if ! kill -0 $APPPID 2>/dev/null; then
              echo "--- вывод программы ---"
              cat app.log 2>/dev/null || echo "вывода нет"
              echo "::error title=Окно Linux::умерла сама: $(tail -15 app.log 2>/dev/null | paste -sd '~' - || echo пусто)"
              exit 1
            fi
            echo "--- все окна процесса ---"
            for W in $(xdotool search --pid $APPPID 2>/dev/null); do
              echo "  $W [$(xdotool getwindowname $W 2>/dev/null)]"
            done
            TITLE=$(xdotool search --pid $APPPID --onlyvisible --name "." getwindowname %@ 2>/dev/null | head -1)
            kill $APPPID 2>/dev/null || true
            echo "заголовок окна: [$TITLE]"
            case "$TITLE" in
              MailFact*) echo "окно открылось"; exit 0 ;;
              "")        echo "::error title=Окно Linux::окна с заголовком не нашлось, движок $PYWEBVIEW_GUI"
                         exit 1 ;;
              *)         echo "::error title=Окно Linux::неожиданный заголовок [$TITLE]"
                         exit 1 ;;
            esac
          '

      - name: Собрать архив с ярлыком
        run: |
          cp assets/MailFact.png dist/MailFact/MailFact.png
          cat > dist/MailFact/MailFact.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=MailFact
          Comment=Проверка существования почтовых ящиков
          Exec=MailFact
          Icon=MailFact
          Terminal=false
          Categories=Network;Email;
          DESKTOP
          cat > dist/MailFact/УСТАНОВКА.txt <<'README'
          MailFact для Linux
          ==================

          Ставить ничего не нужно: программа лежит целиком в этой папке.

              ./MailFact

          ЧЕГО МОЖЕТ НЕ ХВАТИТЬ. Окно рисуется движком Qt WebEngine, он
          лежит внутри архива. Но опирается он на системные графические
          библиотеки, которые внутрь класть нельзя: они обязаны
          соответствовать драйверу видеокарты конкретной машины. На любом
          Linux с рабочим столом они уже стоят. Если окно не открылось:

              sudo apt install libegl1 libgl1 libxkbcommon-x11-0 libnss3
              sudo apt install libxcb-cursor0 libdbus-1-3 libfontconfig1

          (Debian и Ubuntu; в Fedora те же имена через dnf)

          Чтобы появился ярлык в меню приложений:

              mkdir -p ~/.local/share/applications ~/.local/share/icons
              cp MailFact.png ~/.local/share/icons/
              sed "s|Exec=MailFact|Exec=$PWD/MailFact|" MailFact.desktop \
                  > ~/.local/share/applications/MailFact.desktop

          Данные (кэш проверок, настройки, списки доменов) программа пишет
          в папку data рядом с собой. Удалить программу — удалить эту папку.
          README
          tar -czf MailFact-linux-x86_64.tar.gz -C dist MailFact
          SIZE_MB=$(du -m MailFact-linux-x86_64.tar.gz | cut -f1)
          echo "архив: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 60 ]; then echo "архив подозрительно мал"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: MailFact-linux-x86_64.tar.gz

  # ======================================================================
  # РЕЛИЗ — один тег, три файла
  # ======================================================================
  release:
    needs: [windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: артефакты

      - name: Что собралось
        run: ls -lR артефакты

      - name: Определить версию
        id: ver
        run: |
          V="${{ github.ref_name }}"; V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: MailFact ${{ steps.ver.outputs.version }}
          files: |
            артефакты/windows/MailFact-setup.exe
            артефакты/macos/MailFact-macos.dmg
            артефакты/linux/MailFact-linux-x86_64.tar.gz
          body: |
            Проверка существования почтовых ящиков. Python и все библиотеки
            внутри — ставить отдельно ничего не нужно.

            | Система | Файл | Как ставить |
            |---|---|---|
            | Windows 10/11, 64-bit | `MailFact-setup.exe` | запустить, установка идёт в профиль пользователя без прав администратора |
            | macOS 13+ (Apple Silicon) | `MailFact-macos.dmg` | открыть, перетащить MailFact в «Программы» |
            | Linux x86_64 | `MailFact-linux-x86_64.tar.gz` | распаковать, запустить `./MailFact`; внутри лежит `УСТАНОВКА.txt` |

            **Про предупреждения системы.** Цифровой подписи у сборок нет —
            она платная. Windows покажет синий экран «Windows защитила ваш
            компьютер»: **Подробнее** -> **Выполнить в любом случае**. macOS
            скажет «не удаётся проверить разработчика»: правая кнопка по
            программе -> **Открыть**.

            **Windows.** Установщик сам доставит компонент Microsoft WebView2,
            если его нет в системе — на Windows 11 он есть всегда, на
            Windows 10 не обязательно.

            **Чего не будет вне Windows.** Два движка сбора адресов из вкладки
            «Сбор адресов» — «AOL (Tor)» и «Yahoo (Tor)» — работают только на
            Windows: Tor лежит в проекте бинарниками под неё. Остальные движки
            и вся проверка почты работают везде одинаково.
