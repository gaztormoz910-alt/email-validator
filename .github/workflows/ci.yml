name: CI

# Зачем этот файл. До него единственной проверкой был прогон тестов на машине
# разработчика — то есть «работает у меня». Сломанный импорт, забытая
# зависимость в requirements.txt или тест, зелёный только из-за кэша .pyc,
# обнаруживались уже на живой базе.
#
# Здесь четыре независимых сита, и каждое ловит свой класс поломок:
#   1. Тесты на чистом окружении — ловят забытую зависимость.
#   2. Мутационный гейт — ловит ТЕСТ, который не может упасть. Зелёный pytest
#      означает «набор не упал», а не «набор что-то проверяет»; это разные
#      утверждения, и второе доказывается только поломкой кода.
#   3. Типы на ядре — ловят несуществующий атрибут и None там, где ждали строку.
#   4. Разбор ledger'а — ловит модуль, снова выросший в монолит.

on:
  push:
    branches: [master, main, "validator-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows — рабочая площадка владельца, Linux — то, на чём стоит VPS с
        # прокси и куда переезжает проверка на больших базах. Расхождения между
        # ними (пути, кодировки, переводы строк) ловятся именно здесь.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Прогнать тесты
        # Чужой .pyc не должен решать судьбу прогона: -B выключает запись
        # кэша, чтобы зелёный результат означал зелёный ИСХОДНИК.
        run: python -B -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
          # В CI нет ни сети до почтовых серверов, ни дисплея: тесты, которым
          # нужны они, пропускают себя сами по этому флагу.
          VALIDATOR_CI: "1"

  mutation:
    name: Мутационный гейт (тесты обязаны замечать поломки)
    runs-on: ubuntu-latest
    # Потолок времени назван честно: локальный замер после починки списка
    # сторожей — около полутора минут, и почти всё это базовый прогон. Десять
    # минут оставлено на случай, когда мутация проваливается к полному кругу:
    # это ЗАМЕДЛЕНИЕ, а не поломка, и обрывать его по таймауту нельзя — иначе
    # настоящая дыра в наборе выглядела бы как сбой инфраструктуры.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Ломаем код по одному месту и требуем, чтобы набор это заметил.
      # Гейт сам восстанавливает исходники побайтово и сверяет md5, поэтому
      # рабочая копия после него не отличается от checkout'а.
      #
      # Одна ОС и одна версия Python намеренно: гейт проверяет смысл тестов, а
      # не переносимость. Разницу между Windows и Linux ловит задание выше.
      - name: Сломать код по одному месту и потребовать, чтобы тесты заметили
        run: python -B tools/mutation_gate.py
        env:
          PYTHONIOENCODING: utf-8
          VALIDATOR_CI: "1"

  types:
    name: Типы на ядре
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: mypy
        run: python -m mypy

  structure:
    name: Модули не превращаются обратно в монолиты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Проверить размеры модулей
        run: python .unlazy/precision/verify_module_sizes.py

  requirements:
    name: requirements.txt сходится с импортами
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Сверить зависимости
        run: python audit/verify_requirements.py
