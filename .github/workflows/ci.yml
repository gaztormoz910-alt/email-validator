name: CI

on:
  push:
    branches: [master, main, "validator-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Прогнать тесты
        shell: bash
        run: |
          set +e
          python -B -m pytest -q -rf > "$RUNNER_TEMP/pytest.out" 2>&1; RC=$?
          cat "$RUNNER_TEMP/pytest.out"
          if [ $RC -ne 0 ]; then
            echo "::error title=pytest ${{ matrix.os }} ${{ matrix.python }}, код $RC::$(grep -E '^(FAILED|ERROR)|[0-9]+ (passed|failed)' "$RUNNER_TEMP/pytest.out" | tail -12 | cut -c1-300 | paste -sd '~' -)"
            exit $RC
          fi
        env:
          PYTHONIOENCODING: utf-8

  mutation:
    name: Мутационный гейт (тесты обязаны замечать поломки)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Сломать код по одному месту и потребовать, чтобы тесты заметили
        run: python -B tools/mutation_gate.py
        env:
          PYTHONIOENCODING: utf-8

  types:
    name: Типы на ядре
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: mypy
        shell: bash
        run: |
          set +e
          OUT=$(python -m mypy 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=mypy, код $RC::$(echo "$OUT" | tail -15 | paste -sd '~' -)"
            exit $RC
          fi

  structure:
    name: Модули не превращаются обратно в монолиты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Проверить размеры модулей
        run: python tools/verify_module_sizes.py

  requirements:
    name: requirements.txt сходится с импортами
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Сверить зависимости
        run: python audit/verify_requirements.py
