name: CI

# Зачем этот файл. До него единственной проверкой был прогон тестов на машине
# разработчика — то есть «работает у меня». Сломанный импорт, забытая
# зависимость в requirements.txt или тест, зелёный только из-за кэша .pyc,
# обнаруживались уже на живой базе.
#
# Здесь четыре независимых сита, и каждое ловит свой класс поломок:
#   1. Тесты на чистом окружении — ловят забытую зависимость.
#   2. Мутационный гейт — ловит ТЕСТ, который не может упасть. Зелёный pytest
#      означает «набор не упал», а не «набор что-то проверяет»; это разные
#      утверждения, и второе доказывается только поломкой кода.
#   3. Типы на ядре — ловят несуществующий атрибут и None там, где ждали строку.
#   4. Разбор ledger'а — ловит модуль, снова выросший в монолит.

on:
  push:
    branches: [master, main, "validator-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows — рабочая площадка владельца, Linux — то, на чём стоит VPS с
        # прокси и куда переезжает проверка на больших базах. Расхождения между
        # ними (пути, кодировки, переводы строк) ловятся именно здесь.
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Прогнать тесты
        # Чужой .pyc не должен решать судьбу прогона: -B выключает запись
        # кэша, чтобы зелёный результат означал зелёный ИСХОДНИК.
        run: python -B -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
          # VALIDATOR_CI здесь БОЛЬШЕ НЕТ, и это осознанно.
          #
          # Прежний комментарий обещал: «тесты, которым нужны сеть и
          # дисплей, пропускают себя сами по этому флагу». Механизма за
          # обещанием не было — переменную не читал НИКТО (проверено
          # поиском по всему репозиторию 19.09.2026). Обещание без
          # механизма хуже отсутствия обещания: следующий человек решит,
          # что сетевые тесты уже обезврежены, и не станет их смотреть.
          #
          # Что известно взамен, замером: полный набор в ЧИСТОМ клоне
          # (только отслеживаемые файлы, как после checkout) проходит
          # целиком — 2162 passed, 1 xfailed. То есть ни одному тесту
          # такой флаг сегодня не нужен. Понадобится — он заводится
          # вместе с механизмом, а не вместо него.

  mutation:
    name: Мутационный гейт (тесты обязаны замечать поломки)
    runs-on: ubuntu-latest
    # Потолок времени назван честно: локальный замер после починки списка
    # сторожей — около полутора минут, и почти всё это базовый прогон. Десять
    # минут оставлено на случай, когда мутация проваливается к полному кругу:
    # это ЗАМЕДЛЕНИЕ, а не поломка, и обрывать его по таймауту нельзя — иначе
    # настоящая дыра в наборе выглядела бы как сбой инфраструктуры.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Ломаем код по одному месту и требуем, чтобы набор это заметил.
      # Гейт сам восстанавливает исходники побайтово и сверяет md5, поэтому
      # рабочая копия после него не отличается от checkout'а.
      #
      # Одна ОС и одна версия Python намеренно: гейт проверяет смысл тестов, а
      # не переносимость. Разницу между Windows и Linux ловит задание выше.
      - name: Сломать код по одному месту и потребовать, чтобы тесты заметили
        run: python -B tools/mutation_gate.py
        env:
          PYTHONIOENCODING: utf-8

  types:
    name: Типы на ядре
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: mypy
        # Причина провала дублируется в АННОТАЦИЮ: журнал задания у публичного
        # репозитория открывается только после входа, а аннотация — без него.
        # На 1.3.3 и 1.3.4 задание падало с кодом 2 (у mypy это ошибка запуска
        # или разбора, а не ошибка типов), и увидеть почему было нечем: у
        # владельца на Windows и с --platform linux тот же mypy 2.3.1 чист.
        shell: bash
        run: |
          set +e
          OUT=$(python -m mypy 2>&1); RC=$?
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            echo "::error title=mypy, код $RC::$(echo "$OUT" | tail -15 | paste -sd '~' -)"
            exit $RC
          fi

  structure:
    name: Модули не превращаются обратно в монолиты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Проверить размеры модулей
        # Проверка лежит в tools/, а не в .unlazy/: вторая папка числится
        # в .gitignore, после checkout её нет, и задание падало с «файл
        # не найден», ни разу не посмотрев на размеры.
        run: python tools/verify_module_sizes.py

  requirements:
    name: requirements.txt сходится с импортами
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Установить зависимости
        # Оракул требует, чтобы каждый названный пакет не просто стоял в
        # строке файла, а РЕАЛЬНО импортировался в текущем окружении. Без
        # установки он падал на первом же стороннем импорте и проверял не
        # то, что обещал: «пакета нет» вместо «пакет не назван».
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Сверить зависимости
        run: python audit/verify_requirements.py
