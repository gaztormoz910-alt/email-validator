# Конфигурация инструментов проверки.
#
# Именно TOML, а не mypy.ini: ini-файл читается системной кодировкой, и на
# Windows с cp1252 первый же русский комментарий роняет mypy с
# UnicodeDecodeError. TOML по спецификации всегда UTF-8.

[tool.mypy]
# Проверяется НЕ весь проект, и это осознанно. Включить строгий режим на
# четырнадцати тысячах строк за один раз означает получить полторы тысячи
# ошибок, которые никто никогда не разберёт, — то есть выключенную проверку с
# конфигом для вида. Здесь под проверкой те модули, где ошибка типа означает
# неверный ВЕРДИКТ о живом человеке: разбор ответа сервера, синтаксис адреса,
# таблицы почтовиков, чтение входа, операции между базами и хранилище
# результатов.
#
# Список расширяется по мере того, как модули приводятся в порядок. Сокращать
# его нельзя: строка, один раз прошедшая проверку, обязана проходить её и впредь.
python_version = "3.11"
# Без этого mypy видит core/streamer.py и как «streamer», и как «core.streamer»
# (в пакетах нет __init__.py) и отказывается проверять что-либо вообще.
explicit_package_bases = true
mypy_path = "."
namespace_packages = true
files = [
    "core/smtp_codes.py",
    "core/email_syntax.py",
    "core/mail_constants.py",
    "core/org_role.py",
    "core/baseops.py",
    "core/streamer.py",
    "ui/result_store.py",
    "ui/log_buffer.py",
]
ignore_missing_imports = true
# Ошибки в модулях, которые мы ещё не типизировали, не должны заслонять ошибки
# в тех, что типизировали: mypy читает их ради сигнатур, но молчит про них.
# Именно так список и расширяется — по одному модулю, а не «весь проект или
# ничего».
follow_imports = "silent"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Возврат Any там, где объявлен конкретный тип, — самая частая дыра, через
# которую в проверенный код заходит None.
warn_return_any = true
no_implicit_optional = true
# Сравнение несравнимых типов молча даёт False, и ветка не выполняется никогда,
# а тест этого не видит.
strict_equality = true
show_error_codes = true
pretty = true

# ЧУЖИЕ ЗАГЛУШКИ НОВЕЕ НАШЕЙ ЦЕЛИ. numpy 2.x пишет в __init__.pyi
# `type _Falsy = ...` — синтаксис Python 3.12, — и mypy с целью 3.11 падает на
# ЕГО файле с кодом 2, так и не дойдя до наших модулей. Задание «Типы на ядре»
# было красным на 1.3.3 и 1.3.4 ровно поэтому (аннотация CI, 26.09.2026);
# у владельца numpy старше и всё проходило, отсюда «локально чисто».
#
# Ни один проверяемый модуль numpy не импортирует — он приходит транзитивно
# через spaCy, — поэтому его не читаем вовсе. Цель 3.11 при этом не трогаем:
# проект поддерживает 3.11, и НАШ код проверяется именно под неё.
# follow_imports_for_stubs обязателен: numpy поставляет .pyi, а для заглушек
# follow_imports без него не действует.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
